<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <rect width="32" height="32" rx="6" fill="#e74c3c" />
    <!-- Bold Tic Tac Toe Grid -->
    <g stroke="white" stroke-width="3" stroke-linecap="round">
        <line x1="11" y1="5" x2="11" y2="27" />
        <line x1="21" y1="5" x2="21" y2="27" />
        <line x1="5" y1="11" x2="27" y2="11" />
        <line x1="5" y1="21" x2="27" y2="21" />
    </g>
    <!-- Game pieces -->
    <!-- X in top-left -->
    <g stroke="white" stroke-width="2.5" stroke-linecap="round">
        <line x1="7" y1="7" x2="9" y2="9" />
        <line x1="9" y1="7" x2="7" y2="9" />
    </g>
    <!-- O in center -->
    <circle cx="16" cy="16" r="2.5" fill="none" stroke="white" stroke-width="2.5" />
    <!-- X in bottom-right -->
    <g stroke="white" stroke-width="2.5" stroke-linecap="round">
        <line x1="23" y1="23" x2="25" y2="25" />
        <line x1="25" y1="23" x2="23" y2="25" />
    </g>
</svg>