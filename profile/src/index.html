<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <!-- /profile now lives at commonplace. The target is picked from the hostname at runtime
         (the build is the same for dev and prod). The meta refresh is the no-JS fallback (production). -->
    <script>
      (function () {
        var host = location.hostname;
        var target =
          host === "localhost" || host === "127.0.0.1"
            ? "http://localhost:5173/"
            : "https://commonplace.hvalec.com/";
        location.replace(target);
      })();
    </script>
    <meta
      http-equiv="refresh"
      content="0; url=https://commonplace.hvalec.com/"
    />
    <link rel="canonical" href="https://commonplace.hvalec.com/" />
    <title>Hvalec</title>
  </head>
  <body>
    <a href="https://commonplace.hvalec.com/">commonplace.hvalec.com</a>
  </body>
</html>
